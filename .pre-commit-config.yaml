exclude: ^(modules/nf-core/|CITATIONS\.md|assets/)

repos:
  # Formatting for JSON, YAML, Markdown via Prettier (Nextflow files are checked via `nextflow lint`)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.9.6
        files: \.(json|yml|yaml|md)$
        types_or: [file]

  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
